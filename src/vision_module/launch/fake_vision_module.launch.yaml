launch:

- arg:
    name: "identity_db"
    default: "./people.db"
- arg:
    name: "use_pc_camera"
    default: true
- arg:
    name: "camera_number"
    default: true
- arg:
    name: "camera_topic" 
    default: "/camera/image_raw"

- node:
    pkg: "vision_module"
    exec: "fake_vision_server"
    name: "vision_module_node"
    param:
    -
      name: "identity_db"
      value: "/home/plantroid/plantroid_ws/src/robot_memory/db/people.db"
    -
      name: "use_pc_camera"
      value: 1
