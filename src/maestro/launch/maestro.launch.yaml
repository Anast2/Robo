launch:

# args that can be set from the command line or a default will be used
- arg:
    name: "dialog_json"
    default: "/home/plantroid_ws/src/maestro/maestro/dialogue.json"

# start a turtlesim_node in the turtlesim1 namespace
- node:
      pkg: "maestro"
      exec: "maestro"
      name: "maestro_node"
      output: "screen"
      param:
        - dialog_json: "/home/plantroid_ws/src/maestro/maestro/dialogue.json"
