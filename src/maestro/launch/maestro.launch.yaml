launch:

- arg:
    name: "dialog_json"
    default: "/home/plantroid_ws/src/maestro/maestro/dialogue.json"

- arg:
    name: "store_chat_log"
    default: false    

- arg:
    name: "keep_eye_contact"
    default: true 

- arg:
    name: "pc_mode"
    default: false

- arg:
    name: "store_emotion_change"
    default: false

- arg:
    name: "busy_state_machine"
    default: "plantroid_busy_state_machine.pk"

- arg:
    name: "problem_state_machine"
    default: "plantroid_problem_state_machine.pk"

- arg:
    name: "dialog_state_machine"
    default: "plantroid_dialog_state_machine.pk"

- arg:
    name: "robot_name"
    default: "plantroid"    


- node:
      pkg: "maestro"
      exec: "maestro"
      name: "maestro_node"
      output: "screen"
      param:
        - 
          name: "dialog_json"
          value : "/home/plantroid_ws/src/maestro/maestro/dialogue.json"
        -
          name: "store_chat_log"
          value: false
        -
          name: "keep_eye_contact"
          value: true
        -
          name: "pc_mode"
          value: false
        -
          name: "store_emotion_change"
          value: true
        -
          name: "busy_state_machine"
          value: "/home/plantroid_ws/src/maestro/maestro/state_machines/plantroid_busy_state_machine.pkl"
        -
          name: "problem_state_machine"
          value: "/home/plantroid_ws/src/maestro/maestro/state_machines/plantroid_problem_state_machine.pkl"
        -
          name: "dialog_state_machine"
          value: "/home/plantroid_ws/src/maestro/maestro/state_machines/plantroid_dialogue_state_machine.pkl"
        -          
          name: "robot_name"
          default: "plant droid" # write the names as perceived be the STT system. e.g., Plantroid is perceived as "plant droid".