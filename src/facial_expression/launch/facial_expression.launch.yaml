launch:

# args that can be set from the command line or a default will be used
- arg:
    name: "image_folder"
    default: "/home/plantroid_ws/src/facial_expression/facial_expression/IMG"

# start a turtlesim_node in the turtlesim1 namespace
- node:
      pkg: "facial_expression"
      exec: "facial_expression_server"
      name: "facial_expression_node"
      output: "screen"
      param:
        - image_folder: "/home/plantroid_ws/src/facial_expression/facial_expression/IMG"

