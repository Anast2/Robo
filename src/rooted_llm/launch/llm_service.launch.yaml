launch:

- arg:
    name: "mode"
    default: "local"

- arg:
    name: "IP"
    default: "127.0.0.1"    

- arg:
    name: "PORT"
    default: 5050

# start another turtlesim_node in the turtlesim2 namespace and use args to set parameters
- node:
    pkg: "rooted_llm"
    exec: "llm"
    name: "llm_node"
    param: 
    -
      name: "mode"
      value: "local"
    -
      name: "IP"
      value: ""
    -
      name: "PORT"
      value: ""
