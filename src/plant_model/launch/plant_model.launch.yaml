launch:

- arg:
    name: "plant_info_file"
    default: "./plant_characteristics.json"
- arg:
    name: "db_path"
    default: "./plant_db.db"

- node:
    pkg: "plant_model"
    exec: "measurement_scheduler"
    name: "plant_monitor"
    param:
    -
      name: "plant_info_file"
      value: "/home/plantroid/plantroid_ws/src/plant_model/plant_characteristics.json"
    -
      name: "db_path"
      value: "/home/plantroid/plantroid_ws/src/robot_memory/db/plant.db"
