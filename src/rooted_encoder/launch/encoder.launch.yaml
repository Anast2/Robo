launch:

- arg:
    name: "DEVICENAME"
    default: "/dev/ttyServo"
- arg:
    name: "BAUDRATE"
    default: "1_000_000"

- node:
    pkg: "rooted_encoder"
    exec: "encoder"
    name: "encoder_node"
    param:
    -
      name: "DEVICENAME"
      value: "/dev/ttyServo"
    -
      name: "BAUDRATE"
      value: "1_000_000"
