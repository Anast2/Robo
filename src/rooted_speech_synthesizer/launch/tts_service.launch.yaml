# example.launch.yaml

launch:

# args that can be set from the command line or a default will be used
- arg:
    name: "mode"
    default: "local"
- arg:
    name: "model"
    default: "espeak_ng"
- arg:
    name: "IP"
    default: "127.0.0.1"
- arg:
    name: "PORT"
    default: "my/chatter/ns"

- node:
    pkg: "rooted_speech_synthesizer"
    exec: "speech_synthesizer_service"
    name: "speech_synthesizer_service_node"
    param:
    -
      name: "mode"
      value: "local"
    -
      name: "model"
      value: "espeak_ng"
    -
      name: "IP"
      value: ""
    -
      name: "PORT"
      value: ""
